<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
  svg{display:block}
</style></head>
<body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- folder drawn in reference coordinates (1115 x 685), scaled via #place -->
  <g id="place">
    <g id="tilt">
      <!-- back panel (yellow) -->
      <path d="M0,100 A100 100 0 0 1 100,0 L530,0 A70 70 0 0 1 600,70 L600,600 L0,600 Z" fill="#FEE84E"/>
      <!-- sticker -->
      <g id="sticker">
        <g transform="translate(80 3) rotate(6.5)">
          <rect id="stickerShape" x="0" y="0" width="560" height="320" rx="28" fill="#9D58EE"/>
          <text id="stickerText" x="45" y="99" font-family="Manrope" font-weight="400" font-size="82" fill="#fff" letter-spacing="1.5">Кейс 1</text>
        </g>
      </g>
      <!-- front panel (cream) -->
      <path d="M0,245 A100 100 0 0 1 100,145 L362,145 L434,38 Q447,18 476,18 L1018,22 A95 95 0 0 1 1113,117 L1113,585 A100 100 0 0 1 1013,685 L100,685 A100 100 0 0 1 0,585 Z" fill="#FFFEEA"/>
      <!-- logo (client artwork) -->
      <image id="logo" href="logo.png" x="215" y="140" width="680" height="420.5"/>
    </g>
  </g>
</svg>
<script>
const FW=1115, FH=685, SCALE=0.82, CX=960, CY=540, OFF=1150;
const CASES=[["Кейс 1","#0ab8de"],["Кейс 2","#9d58ee"],["Кейс 3","#82d730"],["Кейс 4","#235360"],["Кейс 5","#ff5252"]];
const T={folderIn:[0.05,0.80], stickerOut:[0.62,1.12], stickerIn:[3.20,3.55], folderOut:[3.50,4.05], dur:4.40};
const clamp=x=>Math.min(1,Math.max(0,x));
const prog=(t,[a,b])=>clamp((t-a)/(b-a));
const outBack=(p,s=1.5)=>1+(s+1)*Math.pow(p-1,3)+s*Math.pow(p-1,2);
const inBack=(p,s=1.5)=>(s+1)*p*p*p-s*p*p;
const outCubic=p=>1-Math.pow(1-p,3), inCubic=p=>p*p*p;
const STK_HIDDEN=230; // px (reference units) the sticker sinks into the folder
window.render=(ci,t)=>{
  const [label,color]=CASES[ci];
  document.getElementById('stickerShape').setAttribute('fill',color);
  document.getElementById('stickerText').textContent=label;
  let dy, rot;
  if(t<T.folderOut[0]){ const p=prog(t,T.folderIn); dy=OFF*(1-outBack(p,1.25)); rot=7*(1-outCubic(p)); }
  else { const p=prog(t,T.folderOut); dy=OFF*inBack(p,1.4); rot=-6*inCubic(p); }
  let s, srot;
  if(t<T.stickerIn[0]){ const p=prog(t,T.stickerOut); s=outBack(p,1.8); srot=-6*(1-outCubic(p)); }
  else { const p=prog(t,T.stickerIn); s=1-inBack(p,1.6); srot=-4*inCubic(p); }
  const sy=STK_HIDDEN*(1-s);
  document.getElementById('sticker').setAttribute('transform',`translate(0 ${sy}) rotate(${srot} 80 300)`);
  const ox=CX-FW*SCALE/2, oy=CY-FH*SCALE/2+dy;
  document.getElementById('place').setAttribute('transform',`translate(${ox} ${oy}) scale(${SCALE})`);
  document.getElementById('tilt').setAttribute('transform',`rotate(${rot} ${FW/2} ${FH})`);
};
window.refMode=(color)=>{ // exact reference placement for overlay check
  window.render(1,2.5);
  document.getElementById('place').setAttribute('transform','translate(0 0)');
};
window.DUR=T.dur;
window.render(0,2);
</script>
</body></html>
